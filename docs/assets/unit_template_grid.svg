<svg xmlns="http://www.w3.org/2000/svg" width="408" height="360" viewBox="0 0 408 360" role="img" aria-labelledby="title desc">
  <title id="title">32×32 유닛 프레임 좌표 가이드</title>
  <desc id="desc">왼쪽 위 원점과 16,28 발밑 피벗을 표시한 투명 이미지 캔버스. 타일 바닥이나 유닛 아트 시안이 아니다.</desc>
  <defs>
    <pattern id="pixels" x="40" y="70" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="408" height="360" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#172033" font-size="13">
    <text x="24" y="24" font-size="16" font-weight="bold">프레임 캔버스 32×32px</text>
    <text x="24" y="45">좌표 가이드 · 유닛 아트와 타일 시안 아님</text>
    <rect x="40" y="70" width="256" height="256" fill="#fff"/>
    <rect x="40" y="70" width="256" height="256" fill="url(#pixels)" stroke="#334155"/>
    <path d="M40 70H306M40 70V336" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="66">(0,0)</text>
    <text x="310" y="75">+x</text>
    <text x="13" y="347">+y</text>
    <path d="M168 70V326M40 294H296" fill="none" stroke="#b45309" stroke-dasharray="4 3"/>
    <path d="M160 294H176M168 286V302" fill="none" stroke="#b45309" stroke-width="2"/>
    <circle cx="168" cy="294" r="3" fill="#b45309"/>
    <text x="307" y="286" fill="#92400e">발밑 피벗</text>
    <text x="307" y="305" fill="#92400e">(16,28)</text>
    <text x="44" y="345">같은 캔버스 · 같은 피벗 · 투명 여백 유지</text>
  </g>
</svg>
