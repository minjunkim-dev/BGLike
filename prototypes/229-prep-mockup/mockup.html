<!doctype html>
<!-- #229 정비 화면 목업. 제품 장면이 아니다. 640×360 논리 화면(게임 기본 Viewport)을 그린다.
     렌더: Chrome headless --window-size=640,360 --force-device-scale-factor=2 (1280×720) 또는 1 (640×360).
     ?v=a|b|c 로 안을 고른다. -->
<html lang="ko"><head><meta charset="utf-8"><title>정비 목업</title>
<style>
:root { --bg:#0a0f14; --panel:#121a22; --line:#2a3642; --text:#d8dee4; --dim:#7d8a96;
  --gold:#d6ad4f; --ok:#5fbf6a; --bad:#c0544d; --sel:#4fa3d6; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:640px; height:360px; overflow:hidden; background:var(--bg); color:var(--text);
  font:12px/1.25 "Apple SD Gothic Neo", sans-serif; }
img { image-rendering:pixelated; display:block; }
.abs { position:absolute; }
.panel { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:3px; }
.h { font-size:12px; font-weight:700; }
.small { font-size:10px; color:var(--dim); }
.cell { position:relative; width:36px; height:36px; border:1px solid var(--line); background:#0d141b;
  border-radius:2px; display:flex; align-items:center; justify-content:center; }
.cell img { width:32px; height:32px; }
.cell.empty::after { content:""; }
.cell.reward { border-color:var(--gold); }
.cell.sel { outline:2px solid var(--sel); outline-offset:-1px; }
.cell.target { outline:2px dashed var(--ok); outline-offset:-1px; }
.cell .tag { position:absolute; right:1px; bottom:0; font-size:9px; color:var(--text); text-shadow:0 0 2px #000; }
.cell .slotname { position:absolute; left:0; right:0; top:37px; text-align:center; font-size:10px; color:var(--dim); }
.btn { display:inline-block; height:20px; padding:0 6px; line-height:18px; border:1px solid #3a4856;
  background:#1b2631; border-radius:2px; font-size:11px; white-space:nowrap; }
.btn.primary { border-color:var(--sel); background:#16324a; }
.btn.off { color:#55606a; border-color:#26303a; background:#131a21; }
.btn.danger { border-color:#6a3330; background:#2a1513; }
.big { height:24px; line-height:22px; font-size:12px; padding:0 14px; }
.pip { display:inline-block; width:14px; height:14px; margin-right:1px; vertical-align:middle; }
.pip img { width:14px; height:14px; }
.pip.empty { border:1px dashed #3a4856; border-radius:2px; width:12px; height:12px; margin:1px 2px 1px 1px; }
.hpbar { position:absolute; height:4px; background:#2a1513; border-radius:1px; overflow:hidden; }
.hpbar i { display:block; height:100%; background:var(--bad); }
.down { filter:grayscale(1) brightness(.55); }
.tip { position:absolute; background:#0b1117f2; border:1px solid #4a5a6a; border-radius:3px; padding:4px 6px;
  font-size:11px; line-height:1.35; z-index:5; }
.up { color:var(--ok); } .dn { color:var(--bad); }
.label { position:absolute; font-size:10px; color:var(--gold); }
.cursor { position:absolute; width:0; height:0; border-left:5px solid #fff; border-top:4px solid transparent;
  border-bottom:4px solid transparent; transform:rotate(-30deg); z-index:9; filter:drop-shadow(0 0 1px #000); }
.badge { position:absolute; left:10px; top:336px; font-size:9px; color:#000; background:var(--gold);
  padding:0 3px; border-radius:2px; z-index:10; font-weight:700; }
</style></head><body>
<div id="root"></div>
<script>
const ICON = '../../scenes/combat/art/icons/items/', UNIT = '../../scenes/combat/art/units/';
const w = (h, d) => ({kind:'weapon', name:'무기', s:[['명중',h],['피해',d]]});
const a = (ac, hp) => ({kind:'armor', name:'방어구', s:[['AC',ac],['최대 HP',hp]]});
const p = () => ({kind:'potion', name:'회복 물약', s:[]});
const party = [
  {name:'아군 전사', art:'warrior', hp:14, max:17, weapon:w(1,2), armor:a(2,3), pot:2},
  {name:'아군 궁수', art:'archer', hp:0, max:12, weapon:w(2,1), armor:null, pot:3, down:true},
];
const rewards = [w(3,5), p(), a(3,6)];
const bag = [w(1,1), p(), p(), a(1,2), w(2,3), p(), a(2,4)];
const icon = (it, art) => ICON + (it.kind === 'weapon' ? (art === 'archer' ? 'bow' : 'sword') : it.kind) + '.png';
const desc = it => it ? it.name + it.s.map(([k, v]) => ` · ${k}+${v}`).join('') : '없음';
const el = (html, css) => { const d = document.createElement('div'); d.innerHTML = html.trim();
  const n = d.firstChild; if (css) Object.assign(n.style, css); root.appendChild(n); return n; };
const at = (x, y, ww, hh) => ({left:x + 'px', top:y + 'px', width:ww ? ww + 'px' : undefined, height:hh ? hh + 'px' : undefined});
const cell = (it, cls = '', art) => `<div class="cell ${cls}">${it ? `<img src="${icon(it, art)}">` : ''}</div>`;
const pips = n => [0, 1, 2].map(i => i < n ? `<span class="pip"><img src="${ICON}potion.png"></span>` : '<span class="pip empty"></span>').join('');
const portrait = (u, size) => `<img class="${u.down ? 'down' : ''}" src="${UNIT}${u.art}/idle/right/000.png" style="width:${size}px;height:${size}px">`;
const hp = u => `<div class="hpbar"><i style="width:${100 * u.hp / u.max}%"></i></div>`;
const status = u => `HP ${u.hp} / ${u.max}${u.down ? ' · <span class="dn">전투 불능</span>' : ''}`;
const grid = (x, y, items, cols, cls = '', opts = {}) => {
  const n = opts.slots ?? items.length;
  for (let i = 0; i < n; i++) {
    const it = items[i], c = cls + (opts.sel === i ? ' sel' : '') + (opts.target === i ? ' target' : '');
    el(cell(it, c), at(x + (i % cols) * 40, y + Math.floor(i / cols) * 40)).style.position = 'absolute';
  }
};
const topbar = (title, hint) => {
  el(`<div class="abs h" style="font-size:14px">정비 <span class="small">· 1막 2 스테이지 뒤</span></div>`, at(10, 6));
  el(`<div class="abs small">${hint}</div>`, at(150, 10));
  el(`<div class="abs btn off" title="생략을 켰을 때만 켜짐">정비 종료 확인 다시 켜기</div>`, at(500, 5));
};
const bottombar = note => {
  el(`<div class="abs small" style="color:var(--text)">${note}</div>`, at(10, 336));
  el(`<div class="abs btn big primary">다음 스테이지 ▶</div>`, at(528, 330));
};
const v = new URLSearchParams(location.search).get('v') || 'a';

// A: 클릭으로 고르고 아래 상세 패널의 버튼으로 실행한다.
if (v === 'a') {
  el('<div class="badge">A안 · 클릭 선택 + 상세 패널</div>', {});
  topbar('', '아이템을 클릭해 고르고 아래 버튼으로 장착·해제·폐기');
  party.forEach((u, i) => {
    const y = 30 + i * 104;
    el('<div class="panel"></div>', at(8, y, 300, 98));
    el(portrait(u, 64), at(14, y + 6)).style.position = 'absolute';
    el(`<div class="abs"><div class="h">${u.name}</div><div class="small" style="color:var(--text)">${status(u)}</div></div>`, at(84, y + 6, 130));
    el(hp(u), at(84, y + 38, 120));
    [['무기', u.weapon], ['방어구', u.armor]].forEach(([nm, it], k) => {
      const c = el(cell(it, i === 0 && k === 1 ? '' : '', u.art).replace('</div>', `<span class="slotname">${nm}</span></div>`), at(224 + k * 42, y + 8));
      c.style.position = 'absolute';
    });
    el(`<div class="abs small">${desc(u.weapon)}<br>${desc(u.armor)}</div>`, at(84, y + 48, 210));
    el(`<div class="abs">${pips(u.pot)} <span class="small">물약 ${u.pot}/3</span></div>`, at(14, y + 76));
    const give = i === 0 ? '<span class="btn off">물약 1개 → 궁수</span> <span class="small">궁수 3/3</span>'
                         : '<span class="btn">물약 1개 → 전사</span>';
    el(`<div class="abs">${give}</div>`, at(120, y + 74));
  });
  el('<div class="panel"></div>', at(316, 30, 316, 202));
  el('<div class="label">받지 않은 보상 3 · 정비를 마치면 가방에 보관</div>', at(324, 34));
  grid(324, 48, rewards, 7, 'reward', {sel:0});
  el(`<div class="abs h">공용 가방 <span class="small">${bag.length}/12칸</span></div>`, at(324, 92));
  grid(324, 108, bag, 6, '', {slots:12});
  el('<div class="abs small">빈 칸 5 · 같은 칸 교환은 가득 차도 가능</div>', at(324, 192));
  // 상세 패널: 고른 보상 무기.
  el('<div class="panel" style="border-color:var(--sel)"></div>', at(8, 240, 624, 84));
  el(cell(rewards[0], 'reward'), at(16, 250)).style.position = 'absolute';
  el(`<div class="abs"><div class="h">${desc(rewards[0])}</div><div class="small">받지 않은 보상 · 장착하면 이전 무기는 가방 빈 칸으로</div></div>`, at(60, 250, 400));
  el(`<div class="abs"><span class="btn primary">전사에게 장착</span> <span class="small">명중 <span class="up">+1→+3</span> · 피해 <span class="up">+2→+5</span></span></div>`, at(60, 280));
  el(`<div class="abs"><span class="btn primary">궁수에게 장착</span> <span class="small">명중 <span class="up">+2→+3</span> · 피해 <span class="up">+1→+5</span></span></div>`, at(330, 280));
  el(`<div class="abs small">가방 아이템을 고르면 [폐기], 장착한 방어구를 고르면 [방어구 해제]가 이 자리에 나옵니다. 키보드: 방향키로 이동, Enter로 고르기.</div>`, at(60, 304, 560));
  bottombar('');
}

// B: 드래그로 옮긴다. 우클릭은 빠른 메뉴.
if (v === 'b') {
  el('<div class="badge">B안 · 드래그 앤 드롭</div>', {});
  topbar('', '끌어서 장착·교체·해제·폐기 · 물약을 다른 캐릭터에게 끌어 양도 · 우클릭 빠른 메뉴');
  party.forEach((u, i) => {
    const x = i === 0 ? 8 : 476;
    el('<div class="panel"></div>', at(x, 30, 156, 292));
    el(portrait(u, 64), at(x + 46, 34)).style.position = 'absolute';
    el(`<div class="abs" style="text-align:center"><div class="h">${u.name}</div><div class="small" style="color:var(--text)">${status(u)}</div></div>`, at(x + 4, 98, 148));
    el(hp(u), at(x + 18, 128, 120));
    [['무기', u.weapon], ['방어구', u.armor]].forEach(([nm, it], k) => {
      const tgt = k === 1;  // 방어구를 끄는 중: 두 방어구 칸이 놓을 수 있는 곳
      el(cell(it, tgt ? 'target' : '', u.art).replace('</div>', `<span class="slotname">${nm}</span></div>`), at(x + 34 + k * 50, 140)).style.position = 'absolute';
    });
    el(`<div class="abs small">${desc(u.weapon)}<br>${desc(u.armor)}</div>`, at(x + 8, 196, 146));
    el(`<div class="abs" style="text-align:center">${pips(u.pot)}<div class="small">물약 ${u.pot}/3 · 끌어서 양도</div></div>`, at(x + 4, 236, 148));
  });
  el('<div class="panel"></div>', at(170, 30, 300, 292));
  el('<div class="label">받지 않은 보상 3 · 정비를 마치면 가방에 보관</div>', at(178, 34));
  grid(178, 48, rewards, 7, 'reward');
  el(`<div class="abs h">공용 가방 <span class="small">${bag.length}/12칸</span></div>`, at(178, 94));
  const dragged = bag.slice(); dragged[6] = null;  // 7번째 방어구를 끄는 중
  grid(178, 110, dragged, 6, '', {slots:12});
  el('<div class="abs" style="border:1px dashed var(--bad);border-radius:3px;width:120px;height:36px;color:var(--bad);text-align:center;line-height:34px;font-size:11px">🗑 폐기 (확인 후)</div>', at(178, 200));
  el('<div class="abs small" style="width:160px">가방 아이템만 폐기 칸에 놓을 수 있음</div>', at(304, 202));
  el(`<div class="abs small" style="width:284px">놓을 수 없는 곳은 빨간 테두리와 이유. 예: 가방이 가득 차면 방어구를 가방에 끌어 해제할 수 없음.</div>`, at(178, 244));
  // 끄는 중인 아이콘과 설명.
  el(`<div class="abs" style="opacity:.85"><img src="${ICON}armor.png" style="width:32px;height:32px"></div>`, at(562, 142));
  el('<div class="cursor"></div>', at(588, 166));
  el(`<div class="tip"><b>궁수에게 장착</b><br>${desc(bag[6])}<br>최대 HP 12→16 · HP 0 유지(전투 불능)<br><span class="small">놓으면 장착 · Esc 취소</span></div>`, at(286, 266, 200));
  bottombar('');
}

// C: 대상 캐릭터를 고르고 아이템을 한 번 클릭하면 바로 장착한다.
if (v === 'c') {
  el('<div class="badge">C안 · 대상 선택 + 원클릭 장착</div>', {});
  topbar('', '위에서 캐릭터를 고르고 아이템을 클릭하면 그 캐릭터가 장착·물약 수령');
  party.forEach((u, i) => {
    const x = 8 + i * 316, active = i === 0;
    el(`<div class="panel" style="${active ? 'border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)' : ''}"></div>`, at(x, 30, 308, 112));
    if (active) el('<div class="abs small" style="color:var(--sel)">● 받는 캐릭터</div>', at(x + 230, 34));
    el(portrait(u, 64), at(x + 6, 36)).style.position = 'absolute';
    el(`<div class="abs"><div class="h">${u.name}</div><div class="small" style="color:var(--text)">${status(u)}</div></div>`, at(x + 76, 36, 150));
    el(hp(u), at(x + 76, 68, 110));
    [['무기', u.weapon], ['방어구', u.armor]].forEach(([nm, it], k) => {
      el(cell(it, '', u.art).replace('</div>', `<span class="slotname">${nm}</span></div>`), at(x + 196 + k * 50, 52)).style.position = 'absolute';
    });
    el(`<div class="abs small">${desc(u.weapon)} / ${desc(u.armor)}</div>`, at(x + 8, 104, 296));
    const un = u.armor ? '<span class="btn">방어구 해제</span>' : '<span class="btn off">방어구 해제</span>';
    const give = i === 0 ? '<span class="btn off">→ 궁수</span>' : '<span class="btn">→ 전사</span>';
    el(`<div class="abs">${pips(u.pot)} <span class="small">${u.pot}/3</span> ${give} ${un}</div>`, at(x + 8, 118));
  });
  el('<div class="panel"></div>', at(8, 150, 624, 172));
  el('<div class="label">받지 않은 보상 3</div>', at(16, 156));
  grid(16, 172, rewards, 3, 'reward');
  el('<div class="abs small" style="width:124px">클릭하면 받는 캐릭터가 바로 받음. 남은 보상은 정비를 마치면 가방에 보관</div>', at(16, 216));
  el(`<div class="abs h">공용 가방 <span class="small">${bag.length}/12칸</span></div>`, at(156, 156));
  grid(156, 172, bag, 6, '', {slots:12, sel:4});
  el('<div class="abs small" style="width:200px">우클릭 또는 Delete: 폐기(확인 창)<br>가방 장비를 장착하면 이전 장비가 같은 칸으로</div>', at(156, 256));
  el(`<div class="tip"><b>${desc(bag[4])}</b><br>전사 무기와 비교: 명중 <span class="up">+1→+2</span> · 피해 <span class="up">+2→+3</span><br><span class="small">클릭: 전사가 장착 · 이전 무기는 이 칸으로<br>우클릭: 폐기</span></div>`, at(420, 172, 200));
  el('<div class="cursor"></div>', at(352, 212));
  bottombar('');
}
</script></body></html>
