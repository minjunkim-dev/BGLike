name: PR lint

# PR 제목과 브랜치 이름이 docs/GIT_CONVENTIONS.md 형식인지 확인합니다.
# PR 제목은 squash merge 후 main의 커밋 제목이 됩니다.

on:
  pull_request:
    branches: [main]
    types: [edited]
  workflow_call:
    outputs:
      game:
        description: Run engine checks for this change
        value: ${{ jobs.lint.outputs.game }}

permissions:
  contents: read

jobs:
  lint:
    name: PR conventions and scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game: ${{ steps.scope.outputs.game }}
    env:
      TITLE: ${{ github.event.pull_request.title }}
      BRANCH: ${{ github.head_ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select game checks and check whitespace
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] &&
             [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$BASE_SHA:scripts/ci_scope.py" > "$RUNNER_TEMP/trusted-ci-scope.py"; then
            python3 "$RUNNER_TEMP/trusted-ci-scope.py"
          else
            echo 'game=true' >> "$GITHUB_OUTPUT"
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              git diff --check --no-renames "$BASE_SHA" HEAD
            else
              git show --check --format= --diff-merges=first-parent HEAD
            fi
          fi
      - name: Test scope and review authorization
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: PR title
        if: github.event_name == 'pull_request'
        run: |
          types='feat|fix|refactor|perf|test|docs|build|ci|chore|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9_-]+\))?!?: [a-z]"; then
            echo "::error::PR 제목이 '<type>(<scope>): <소문자 설명>' 형식이 아닙니다: '$TITLE'"
            echo "type: $types. 예: feat(combat): add initiative turn order. 규칙: docs/GIT_CONVENTIONS.md"
            exit 1
          fi
          # Dependabot names long actions in full, e.g. anthropics/claude-code-action/base-action.
          # Gate on the GitHub-set author; anyone can name a branch dependabot/.
          if [ "${#TITLE}" -gt 72 ] && [ "$AUTHOR" != 'dependabot[bot]' ]; then
            echo "::error::PR 제목이 72자를 넘습니다 (${#TITLE}자)."
            exit 1
          fi
          case "$TITLE" in *.) echo "::error::PR 제목 끝에 마침표를 찍지 않습니다."; exit 1;; esac
      - name: Branch name
        if: github.event_name == 'pull_request'
        run: |
          types='feat|fix|refactor|perf|test|docs|build|ci|chore|revert'
          if printf '%s' "$BRANCH" | grep -Eq '^(claude|codex|dependabot)/'; then
            echo "에이전트 브랜치는 이름을 검사하지 않습니다: $BRANCH"
            exit 0
          fi
          # 코드 브랜치(feat, fix, ...)는 <issue번호>-<설명> 필수. 문서·설정 브랜치(docs, build, ci, chore)는 Issue 없이 <설명>만 허용.
          desc='[a-z0-9]+(-[a-z0-9]+)*'
          if ! printf '%s' "$BRANCH" | grep -Eq "^(($types)/[0-9]+-$desc|(docs|build|ci|chore)/[a-z]$desc)$"; then
            echo "::error::브랜치 이름이 '<type>/<issue번호>-<짧은-설명>' 형식이 아닙니다: '$BRANCH'"
            echo "소문자, 숫자, '-'만 씁니다. feat, fix 등 코드 브랜치는 Issue 번호가 필요하고, docs, build, ci, chore는 Issue 없이 설명만 써도 됩니다. 예: feat/12-combat-base, docs/issue-flow. 규칙: docs/GIT_CONVENTIONS.md"
            exit 1
          fi
