name: Verification Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Verification prerelease (vX.Y.Z-alpha.N or vX.Y.Z-beta.N)
        required: true
        type: string
        default: v0.1.0-alpha.1
      source-sha:
        description: Full 40-character lowercase source commit SHA already in main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: verification-draft-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source-sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/draft-release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package-digest: ${{ steps.package.outputs.digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts
      - name: Validate source, CI and version before build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/draft_release.py check
      - name: Checkout exact build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          path: source
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Resolve pinned engine
        id: engine
        working-directory: source
        run: source scripts/godot_environment.sh
      - name: Install pinned Godot
        working-directory: source
        run: bash scripts/install_godot.sh
      - name: Package and smoke exact source
        id: package
        working-directory: source
        env:
          GODOT: ${{ steps.engine.outputs.binary }}
          ENGINE_ARCHIVE_SHA256: ${{ steps.engine.outputs.sha256 }}
        run: |
          python3 ../trusted/scripts/package_pck.py --output "$RUNNER_TEMP/package"
          read -r digest _ < "$RUNNER_TEMP/package/SHA256SUMS"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload verified build output
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-pck
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout only trusted release helper and engine pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/draft_release.py
            /scripts/godot.env
      - name: Download exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/draft-artifact
          merge-multiple: true
      - name: Compare build output digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.package-digest }}
          ARTIFACT_DIR: ${{ runner.temp }}/draft-artifact
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list(Path(os.environ['ARTIFACT_DIR']).glob('*.zip'))
          if len(files) != 1 or hashlib.sha256(files[0].read_bytes()).hexdigest() != os.environ['EXPECTED_DIGEST']:
              raise SystemExit('Build/download digest mismatch')
          PY
      - name: Revalidate and create unpublished verification Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/draft_release.py create --artifact "$RUNNER_TEMP/draft-artifact"
