name: Verification Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Verification prerelease (vX.Y.Z-alpha.N or vX.Y.Z-beta.N)
        required: true
        type: string
        default: v0.1.0-alpha.1
      source-sha:
        description: Full 40-character lowercase source commit SHA already in main
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: verification-draft-request-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source-sha }}

jobs:
  request:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/draft-release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted request helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts
      - name: Validate source and record the exact request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/draft_release.py request --request "$RUNNER_TEMP/request"
      - name: Upload request data only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request/request.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
