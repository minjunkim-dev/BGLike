name: Godot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/pr-lint.yml

  smoke:
    needs: policy
    if: needs.policy.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import project
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --import'
      - name: Start main scene
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --quit-after 2'
      - name: Check combat turn rules
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tests/combat_turns_test.gd'
      - name: Check combat roll rules
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tests/combat_checks_test.gd'
      - name: Check combat actions
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tests/combat_actions_test.gd'
      - name: Check combat HUD
        run: '"$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tests/combat_hud_test.gd'

  notify:
    needs: [policy, smoke]
    if: >-
      always() &&
      (needs.policy.result == 'failure' || needs.smoke.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions: {}
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
      CI_RESULT: ${{ needs.smoke.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
    steps:
      - name: Post Godot result to Discord
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          python3 - <<'PY' > "$RUNNER_TEMP/discord-ci.json"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)

          target = f"PR #{event['pull_request']['number']}" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else os.environ["GITHUB_REF_NAME"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "content": f"CI failure on {target}: policy={os.environ['POLICY_RESULT']}, Godot={os.environ['CI_RESULT']}\n{run_url}",
              "allowed_mentions": {"parse": []},
          }))
          PY
          curl --fail --silent --show-error --retry 2 \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord-ci.json" \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL?wait=true"
