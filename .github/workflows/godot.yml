name: Godot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/pr-lint.yml

  smoke:
    needs: policy
    if: needs.policy.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_FILE: Godot_v4.7.2-stable_linux.x86_64
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - name: Restore Godot archive
        id: godot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot.zip
          key: godot-${{ runner.os }}-${{ runner.arch }}-4.7.2-${{ env.GODOT_SHA256 }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Install Godot 4.7.2
        id: godot-install
        shell: bash
        run: |
          godot_archive="$RUNNER_TEMP/godot.zip"
          godot_archive_source=restored
          verify_godot_archive() {
            printf '%s  %s\n' "$GODOT_SHA256" "$godot_archive" | sha256sum -c -
          }
          if [ ! -f "$godot_archive" ]; then
            godot_archive_source=downloaded
          elif ! verify_godot_archive; then
            godot_archive_source=recovered
            printf 'Restored Godot archive failed verification; downloading the official archive again.\n'
            rm -f "$godot_archive"
          fi
          printf 'archive-source=%s\n' "$godot_archive_source" >> "$GITHUB_OUTPUT"
          if [ ! -f "$godot_archive" ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 120 -o "$godot_archive" \
              "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT_FILE.zip"
          fi
          verify_godot_archive
          unzip -q "$godot_archive" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/$GODOT_FILE"
          "$RUNNER_TEMP/$GODOT_FILE" --version
      - name: Import project
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --import'
      - name: Start main scene
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --quit-after 2'
      - name: Check combat turn rules
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --script tests/combat_turns_test.gd'
      - name: Check combat roll rules
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --script tests/combat_checks_test.gd'
      - name: Check combat actions
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --script tests/combat_actions_test.gd'
      - name: Check combat HUD
        run: '"$RUNNER_TEMP/$GODOT_FILE" --headless --path . --script tests/combat_hud_test.gd'
      - name: Record engine cache state
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.godot-cache.outcome }}
          ARCHIVE_SOURCE: ${{ steps.godot-install.outputs.archive-source }}
          INSTALL_RESULT: ${{ steps.godot-install.outcome }}
        run: |
          cache_hit="${CACHE_HIT:-unknown}"
          if [ "${CACHE_RESULT:-}" = success ] && [ -z "${CACHE_HIT:-}" ]; then
            cache_hit=false
          fi
          printf 'Godot 4.7.2 cache restore: %s; cache hit: %s; archive source: %s; install: %s. Cache restoration does not skip SHA-256 verification or engine checks.\n' \
            "${CACHE_RESULT:-unknown}" "$cache_hit" \
            "${ARCHIVE_SOURCE:-unknown}" "${INSTALL_RESULT:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [policy, smoke]
    if: >-
      always() &&
      (needs.policy.result == 'failure' || needs.smoke.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions: {}
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
      CI_RESULT: ${{ needs.smoke.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
    steps:
      - name: Post Godot result to Discord
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          python3 - <<'PY' > "$RUNNER_TEMP/discord-ci.json"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)

          target = f"PR #{event['pull_request']['number']}" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else os.environ["GITHUB_REF_NAME"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "content": f"CI failure on {target}: policy={os.environ['POLICY_RESULT']}, Godot={os.environ['CI_RESULT']}\n{run_url}",
              "allowed_mentions": {"parse": []},
          }))
          PY
          curl --fail --silent --show-error --retry 2 \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord-ci.json" \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL?wait=true"
