name: Godot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue tests the queued result here; without it a queued PR never merges.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-cache:
        description: Restore and save the verified Godot archive
        type: boolean
        default: true

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/pr-lint.yml

  # smoke needs only this answer, so it starts without waiting for policy's script tests and lint.
  scope:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game: ${{ steps.scope.outputs.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select game checks and check whitespace
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] &&
             [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$BASE_SHA:scripts/ci_scope.py" > "$RUNNER_TEMP/trusted-ci-scope.py"; then
            python3 "$RUNNER_TEMP/trusted-ci-scope.py"
          else
            echo 'game=true' >> "$GITHUB_OUTPUT"
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              git diff --check --no-renames "$BASE_SHA" HEAD
            else
              git show --check --format= --diff-merges=first-parent HEAD
            fi
          fi

  smoke:
    needs: scope
    if: needs.scope.outputs.game == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Resolve pinned engine
        id: engine
        run: source scripts/godot_environment.sh
      - name: Restore Godot archive
        id: godot-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot.zip
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.version }}-${{ steps.engine.outputs.sha256 }}
      - name: Install pinned Godot
        id: godot-install
        shell: bash
        run: make godot-install
      # With the runner's 53 fonts (none Korean) visible, Godot's fallback font lookup made combat scene
      # setup several times slower (#430). Searching only the Noto CJK folder keeps real Hangul metrics and halves that time.
      # The fonts come from the Actions cache; apt runs only on a miss (a slow mirror once took 15 minutes).
      - name: Restore Noto CJK fonts
        id: fonts-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/noto
          key: fonts-noto-cjk-ubuntu-24.04-v1
      - name: Install Noto CJK fonts
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null
          mkdir -p "$RUNNER_TEMP/noto"
          cp /usr/share/fonts/opentype/noto/* "$RUNNER_TEMP/noto/"
      - name: Limit fonts to Noto CJK
        run: |
          cat > "$RUNNER_TEMP/fonts.conf" <<EOF
          <?xml version="1.0"?>
          <fontconfig>
            <dir>$RUNNER_TEMP/noto</dir>
            <cachedir>$RUNNER_TEMP/fontconfig</cachedir>
          </fontconfig>
          EOF
          FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf" fc-list :lang=ko family | grep -q 'Noto Sans CJK KR'
      - name: Check project with the shared local command
        env:
          GODOT: ${{ steps.engine.outputs.binary }}
          FONTCONFIG_FILE: ${{ runner.temp }}/fonts.conf
        run: make godot-check
      - name: Record engine cache state
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.godot-cache.outcome }}
          ARCHIVE_SOURCE: ${{ steps.godot-install.outputs.archive-source }}
          INSTALL_RESULT: ${{ steps.godot-install.outcome }}
          ENGINE_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          cache_hit="${CACHE_HIT:-unknown}"
          if [ "${CACHE_RESULT:-}" = success ] && [ -z "${CACHE_HIT:-}" ]; then
            cache_hit=false
          fi
          printf 'Godot %s cache restore: %s; cache hit: %s; archive source: %s; install: %s. Cache restoration does not skip SHA-256 verification or engine checks.\n' \
            "${ENGINE_VERSION:-unknown}" "${CACHE_RESULT:-unknown}" "$cache_hit" \
            "${ARCHIVE_SOURCE:-unknown}" "${INSTALL_RESULT:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  # Old required check, kept until the owner applies the single `ci` check; then fold it into `ci`.
  legacy-ci:
    name: CI
    needs: [policy, scope, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          GAME_REQUIRED: ${{ needs.scope.outputs.game }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: python3 scripts/ci_gate.py

  # The one required check (repo-baseline contract): it passes only when every job it needs succeeded.
  # policy and scope are needed directly so their failure blocks even if ci_gate.py breaks; smoke is not,
  # because it is skipped on docs-only changes and legacy-ci already judges it.
  ci:
    name: ci
    needs: [policy, scope, legacy-ci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended with $r"; exit 1; }; done

  notify:
    needs: [policy, scope, smoke]
    if: >-
      always() &&
      (needs.policy.result == 'failure' || needs.scope.result == 'failure' || needs.smoke.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions: {}
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
      CI_RESULT: ${{ needs.smoke.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      SCOPE_RESULT: ${{ needs.scope.result }}
    steps:
      - name: Post Godot result to Discord
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          python3 - <<'PY' > "$RUNNER_TEMP/discord-ci.json"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)

          target = f"PR #{event['pull_request']['number']}" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else os.environ["GITHUB_REF_NAME"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "content": f"CI failure on {target}: policy={os.environ['POLICY_RESULT']}, scope={os.environ['SCOPE_RESULT']}, Godot={os.environ['CI_RESULT']}\n{run_url}",
              "allowed_mentions": {"parse": []},
          }))
          PY
          curl --fail --silent --show-error --retry 2 \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord-ci.json" \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL?wait=true"
