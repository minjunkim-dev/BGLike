name: Godot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-cache:
        description: Restore and save the verified Godot archive
        type: boolean
        default: true

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/pr-lint.yml

  smoke:
    needs: policy
    if: needs.policy.outputs.game == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Resolve pinned engine
        id: engine
        run: source scripts/godot_environment.sh
      - name: Restore Godot archive
        id: godot-cache
        if: github.event_name != 'workflow_dispatch' || inputs.use-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot.zip
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.version }}-${{ steps.engine.outputs.sha256 }}
      - name: Install pinned Godot
        id: godot-install
        shell: bash
        run: make godot-install
      - name: Check project with the shared local command
        env:
          GODOT: ${{ steps.engine.outputs.binary }}
        run: make godot-check
      - name: Record engine cache state
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.godot-cache.outcome }}
          ARCHIVE_SOURCE: ${{ steps.godot-install.outputs.archive-source }}
          INSTALL_RESULT: ${{ steps.godot-install.outcome }}
          ENGINE_VERSION: ${{ steps.engine.outputs.version }}
        run: |
          cache_hit="${CACHE_HIT:-unknown}"
          if [ "${CACHE_RESULT:-}" = success ] && [ -z "${CACHE_HIT:-}" ]; then
            cache_hit=false
          fi
          printf 'Godot %s cache restore: %s; cache hit: %s; archive source: %s; install: %s. Cache restoration does not skip SHA-256 verification or engine checks.\n' \
            "${ENGINE_VERSION:-unknown}" "${CACHE_RESULT:-unknown}" "$cache_hit" \
            "${ARCHIVE_SOURCE:-unknown}" "${INSTALL_RESULT:-unknown}" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [policy, smoke]
    if: >-
      always() &&
      (needs.policy.result == 'failure' || needs.smoke.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions: {}
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
      CI_RESULT: ${{ needs.smoke.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
    steps:
      - name: Post Godot result to Discord
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          python3 - <<'PY' > "$RUNNER_TEMP/discord-ci.json"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)

          target = f"PR #{event['pull_request']['number']}" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else os.environ["GITHUB_REF_NAME"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print(json.dumps({
              "content": f"CI failure on {target}: policy={os.environ['POLICY_RESULT']}, Godot={os.environ['CI_RESULT']}\n{run_url}",
              "allowed_mentions": {"parse": []},
          }))
          PY
          curl --fail --silent --show-error --retry 2 \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord-ci.json" \
            --output /dev/null \
            "$DISCORD_WEBHOOK_URL?wait=true"
